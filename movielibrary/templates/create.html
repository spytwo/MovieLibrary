<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Добавить новый фильм</title>

        <link rel="icon" href="{{ cdn }}favicon.png" type="image/png" />

        <style>
            body {
                font-family: Arial, sans-serif;
                max-width: 600px;
                margin: 0 auto;
                padding: 20px;
                line-height: 1.6;
            }

            h1 {
                color: #333;
                text-align: center;
                margin-bottom: 20px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            label {
                display: block;
                margin-bottom: 8px;
                font-weight: bold;
            }

            .required::after {
                content: " *";
                color: red;
            }

            input[type="text"],
            input[type="number"],
            input[type="file"],
            textarea,
            select {
                width: 100%;
                padding: 10px;
                border: 1px solid #ddd;
                border-radius: 4px;
                box-sizing: border-box;
                font-size: 16px;
            }

            textarea {
                height: 120px;
                resize: vertical;
            }

            .multi-select {
                height: 150px;
            }

            button {
                background-color: #4caf50;
                color: white;
                padding: 12px 20px;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 16px;
                width: 100%;
                transition: background-color 0.3s;
            }

            button:hover {
                background-color: #45a049;
            }

            .file-upload {
                margin-top: 10px;
            }

            .form-note {
                font-size: 14px;
                color: #666;
                margin-top: 5px;
            }
        </style>
    </head>

    <body>
        <h1>Добавить новый фильм</h1>

        <form action="/create" method="post" enctype="multipart/form-data">
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token }}"
            />

            <!-- Название -->
            <div class="form-group">
                <label for="title" class="required">
                    Название фильма
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    required
                />
            </div>

            <!-- Год -->
            <div class="form-group">
                <label for="year" class="required">
                    Год выпуска
                </label>

                <input
                    type="number"
                    id="year"
                    name="year"
                    min="1888"
                    max="2099"
                    required
                />
            </div>

            <!-- Описание -->
            <div class="form-group">
                <label for="description">
                    Описание
                </label>

                <textarea
                    id="description"
                    name="description"
                ></textarea>
            </div>

            <!-- Рейтинг -->
            <div class="form-group">
                <label for="rating" class="required">
                    Рейтинг
                </label>

                <input
                    type="number"
                    id="rating"
                    name="rating"
                    step="0.1"
                    min="0"
                    max="10"
                    required
                />
            </div>

            <!-- Постер -->
            <div class="form-group">
                <label for="photo" class="required">
                    Название постера
                </label>

                <input
                    type="text"
                    id="photo"
                    name="photo"
                    required
                />
            </div>

            <!-- Тип контента -->
            <div class="form-group">
                <label for="type" class="required">
                    Тип контента
                </label>

                <select id="type" name="type" required>
                    <option value="movie">Фильм</option>
                    <option value="series">Сериал</option>
                </select>
            </div>

            <!-- Жанры -->
            <div class="form-group">
                <label for="genres">
                    Жанры
                </label>

                <select
                    id="genres"
                    name="genres"
                    multiple
                    class="multi-select"
                >
                    {% for genre in genre_list %}
                    <option value="{{ genre.id }}">
                        {{ genre.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Страны -->
            <div class="form-group">
                <label for="countries">
                    Страны
                </label>

                <select
                    id="countries"
                    name="countries"
                    multiple
                    class="multi-select"
                >
                    {% for country in country_list %}
                    <option value="{{ country.id }}">
                        {{ country.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Код -->
            <div class="form-group">
                <label for="code" class="required">
                    Код
                </label>

                <input
                    type="text"
                    id="code"
                    name="code"
                    required
                />
            </div>

            <!-- Кнопка -->
            <div class="form-group">
                <button type="submit">
                    Добавить фильм
                </button>
            </div>
        </form>
    </body>
</html>
