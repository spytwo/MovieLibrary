<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Восстановление пароля — FilmLibrary</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: Open Sans, sans-serif;
                background: #F0F4F8;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                padding: 20px;
            }

            .reset-container {
                background: white;
                padding: 30px;
                border-radius: 10px;
                box-shadow: 0 10px 30px rgba(27, 38, 59, 0.08);
                width: 100%;
                max-width: 400px;
                border: 1px solid #D4E2EE;
            }

            .reset-header {
                text-align: center;
                margin-bottom: 25px;
            }

            .reset-header h2 {
                color: #1B263B;
                font-size: 24px;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .form-group label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
                color: #2C3E50;
            }

            .form-group input {
                width: 100%;
                padding: 12px;
                border: 1px solid #D4E2EE;
                border-radius: 5px;
                font-size: 16px;
                transition: border-color 0.3s, background-color 0.3s;
                background: #F8FAFC;
                color: #1B263B;
            }

            .form-group input:focus {
                border-color: #4A90E2;
                outline: none;
                background: white;
            }

            .reset-btn {
                width: 100%;
                padding: 12px;
                background: linear-gradient(45deg, #1B263B, #2C3E50);
                color: white;
                border: none;
                border-radius: 5px;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 4px 10px rgba(27, 38, 59, 0.25);
                margin-top: 5px;
            }

            .reset-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 16px rgba(27, 38, 59, 0.4);
            }

            .back-to-login {
                display: block;
                text-align: center;
                margin-top: 20px;
                color: #5A6E85;
                text-decoration: none;
                font-weight: bold;
                transition: color 0.2s;
                font-size: 14px;
            }

            .back-to-login:hover {
                color: #1B263B;
                text-decoration: underline;
            }

            .register-link {
                text-align: center;
                margin-top: 20px;
                padding-top: 20px;
                border-top: 1px solid #E1E8F0;
                color: #5A6E85;
                font-size: 14px;
            }

            .register-link a {
                color: #4A90E2;
                text-decoration: none;
                font-weight: bold;
                transition: color 0.2s;
            }

            .register-link a:hover {
                color: #1B263B;
                text-decoration: underline;
            }

            .back-to-main {
                display: block;
                text-align: center;
                margin-top: 20px;
                color: #5A6E85;
                text-decoration: none;
                font-weight: bold;
                transition: color 0.2s;
            }

            .back-to-main:hover {
                color: #1B263B;
                text-decoration: underline;
            }

            .hint-text {
                font-size: 13px;
                color: #5A6E85;
                margin-top: 4px;
            }
        </style>
    </head>
    <body>
        <div class="reset-container">
            <div class="reset-header">
                <h2>Восстановление пароля</h2>
            </div>

            <form method="POST" action="/forgot_password">
                <div class="form-group">
                    <label for="reset-email">Электронная почта</label>
                    <input
                        type="email"
                        id="reset-email"
                        name="email"
                        placeholder="your@email.com"
                        required
                    />
                    <div class="hint-text">Вам придет письмо с паролем для входа</div>
                </div>

                <button type="submit" class="reset-btn">Отправить</button>
            </form>

            <div class="register-link">
                Нет аккаунта? <a href="/register">Зарегистрироваться</a>
            </div>

            <a href="/" class="back-to-main">Вернуться на главную</a>
        </div>
    </body>
</html>
